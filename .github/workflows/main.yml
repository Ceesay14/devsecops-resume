name: DevSecOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Code Scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/security-audit

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-secure-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Automated Deployment to AWS EC2
        uses: appleboy/ssh-action@master
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        with:
          host: 3.144.193.174
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            # 1. Reset any stale background Docker auth tokens
            docker logout || true
            docker logout ://amazonaws.com || true
            
            # 2. Authenticate the host server's local Docker daemon directly into ECR
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin ://amazonaws.com
            
            # 3. Clean up the older active application container environment if it exists
            docker stop my-running-app || true
            docker rm my-running-app || true
            
            # 4. Pull down the fresh image update and run it on target web port 5000
            docker pull ://amazonaws.com/my-secure-app:latest
            docker run -d -p 5000:5000 --name my-running-app ://amazonaws.com/my-secure-app:latest
