name: DevSecOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Code Scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/security-audit

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-secure-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Automated Deployment to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /bin/bash -l -c "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin ://amazonaws.com"
            /bin/bash -l -c "docker pull ://amazonaws.com/my-secure-app:latest"
            /bin/bash -l -c "docker stop my-running-app || true"
            /bin/bash -l -c "docker rm my-running-app || true"
            /bin/bash -l -c "docker run -d -p 5000:5000 --name my-running-app ://amazonaws.com/my-secure-app:latest"
